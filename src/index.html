<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
// =====================================================================
//  GenLayer × Insurance — motion graphic (1080x1080)
//  Fully deterministic: renderFrame(t) draws the frame at time t (sec).
// =====================================================================
const W = 1080, H = 1080, DUR = 66;
const C = {
  pink: '#ff87ff', mag: '#dc00ff', violet: '#7b2cff', deep: '#2b004d',
  cyan: '#5cf2ff', white: '#fff4ff', hot: '#ff3d9a', red: '#ff3b6b', lav: '#e7d4ff'
};
const FONT = '"Inter Display", Inter, sans-serif';
const MONO = '"DejaVu Sans Mono", "Liberation Mono", monospace';

const main = document.getElementById('c'), mctx = main.getContext('2d');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const base = mk(W, H), ctx = base.getContext('2d');
const bloomA = mk(W / 4, H / 4), bA = bloomA.getContext('2d');
const bloomB = mk(W / 12, H / 12), bB = bloomB.getContext('2d');
const tmp = mk(W, H), tctx = tmp.getContext('2d');

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, s, d) => clamp((t - s) / d);
const TAU = Math.PI * 2;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * TAU / 3) + 1,
};
const rnd = (i, s = 0) => { const x = Math.sin(i * 127.1 + s * 311.7 + 0.123) * 43758.5453; return x - Math.floor(x); };

// ---------------------------------------------------------------- timeline
const SCENES = [
  [0, 6, 's1', '01 // INTRO'],
  [6, 14, 's2', '02 // STATUS QUO'],
  [14, 18, 's3', '03 // THE QUESTION'],
  [18, 26, 's4', '04 // CASE STUDY'],
  [26, 36, 's5', '05 // INTELLIGENT CONTRACTS'],
  [36, 44, 's6', '06 // OPTIMISTIC DEMOCRACY'],
  [44, 50, 's7', '07 // BEYOND'],
  [50, 54, 's8', '08 // REALITY CHECK'],
  [54, 60, 's9', '09 // THE BIGGER QUESTION'],
  [60, 66, 's10', '10 // GENLAYER'],
];
const TRANSITIONS = [6, 14, 18, 26, 36, 44, 50, 54];
const IMPACTS = [ // [time, shake, flash]
  [3.0, 22, .6], [7.0, 7, .12], [8.5, 7, .12], [10.0, 7, .12], [12.4, 9, .1],
  [16.3, 16, .35], [26.5, 9, .25], [42.0, 12, .3], [55.8, 8, .12], [57.2, 15, .35], [60.0, 18, .5]
];
const GLITCHES = [[3.0, .28], [16.3, .3], [26.0, .15], [56.8, .4], [60.0, .3], [14.0, .12], [36.0, .12], [54.0, .15]];

// ---------------------------------------------------------------- logo
const LOGO = {
  L: [[-17.5, -176], [-180.5, 162], [-22.5, 100], [-75.5, 73], [-17.5, -58]],
  R: [[17.5, -176], [180.5, 162], [22.5, 100], [75.5, 73], [17.5, -58]],
  C: [[0, -14], [-34, 54], [0, 73], [34, 54]],
};
function perim(pts) { let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s += Math.hypot(b[0] - a[0], b[1] - a[1]); } return s; }
function polyPath(c, pts, s) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0] * s, p[1] * s) : c.moveTo(p[0] * s, p[1] * s)); c.closePath(); }

function drawLogo(c, x, y, s, o = {}) {
  const fill = o.fill ?? 1, stroke = o.stroke ?? 0, a0 = c.globalAlpha * (o.alpha ?? 1);
  c.save(); c.translate(x, y);
  for (const k of ['L', 'R', 'C']) {
    const off = (o.off && o.off[k]) || [0, 0, 0];
    const st = typeof stroke === 'object' ? stroke[k] : stroke;
    c.save(); c.translate(off[0] * s, off[1] * s); c.rotate(off[2]);
    polyPath(c, LOGO[k], s);
    if (fill > 0) {
      const g = c.createLinearGradient(0, -176 * s, 0, 162 * s);
      g.addColorStop(0, o.top || C.pink); g.addColorStop(1, o.bottom || C.mag);
      c.globalAlpha = a0 * fill; c.fillStyle = g; c.fill();
    }
    if (st > 0) {
      const len = perim(LOGO[k]) * s;
      c.globalAlpha = a0; c.setLineDash([len * st, len + 10]); c.lineDashOffset = 0;
      c.lineWidth = o.lw || 3; c.lineJoin = 'round'; c.strokeStyle = o.strokeStyle || C.pink; c.stroke(); c.setLineDash([]);
    }
    c.restore();
  }
  if (o.shine != null && o.shine > -1 && o.shine < 2) {
    c.save();
    c.beginPath();
    for (const k of ['L', 'R', 'C']) { LOGO[k].forEach((p, i) => i ? c.lineTo(p[0] * s, p[1] * s) : c.moveTo(p[0] * s, p[1] * s)); c.closePath(); }
    c.clip();
    const sx = lerp(-260, 260, o.shine) * s;
    const g = c.createLinearGradient(sx - 60 * s, -200 * s, sx + 60 * s, 200 * s);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.globalAlpha = a0; c.fillStyle = g;
    c.translate(sx, 0); c.rotate(.35); c.fillRect(-40 * s, -400 * s, 80 * s, 800 * s);
    c.restore();
  }
  c.restore();
}

// ---------------------------------------------------------------- text
function setFont(c, o) {
  c.font = `${o.w || 800} ${o.size || 40}px ${o.font || FONT}`;
  c.letterSpacing = (o.ls || 0) + 'px';
}
function measure(c, s, o) { c.save(); setFont(c, o); const m = c.measureText(s).width; c.restore(); return m; }
function fit(c, s, o, maxW) { const m = measure(c, s, o); return m > maxW ? o.size * maxW / m : o.size; }
function txt(c, s, x, y, o = {}) {
  if (!s) return;
  c.save();
  setFont(c, o);
  c.textAlign = o.align || 'center'; c.textBaseline = o.base || 'middle';
  c.globalAlpha *= (o.a ?? 1);
  c.fillStyle = o.color || C.white;
  if (o.grad) {
    const m = o.gw || c.measureText(s).width;
    const x0 = c.textAlign === 'center' ? x - m / 2 : c.textAlign === 'right' ? x - m : x;
    const g = c.createLinearGradient(x0, 0, x0 + m, 0);
    o.grad.forEach((col, i) => g.addColorStop(i / (o.grad.length - 1), col));
    c.fillStyle = g;
  }
  if (o.stroke) { c.lineWidth = o.lw || 2; c.strokeStyle = o.stroke; c.strokeText(s, x, y); }
  if (!o.noFill) c.fillText(s, x, y);
  c.restore();
}
const GL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@$<>/\\=+*';
function decode(s, p, seed = 0, t = 0) {
  if (p >= 1) return s; if (p <= 0) return '';
  let out = ''; const n = s.length, fr = Math.floor(t * 24);
  for (let i = 0; i < n; i++) {
    const ch = s[i];
    if (ch === ' ') { out += ' '; continue; }
    const th = (i / n) * 0.7 + rnd(i, seed) * 0.2;
    if (p > th + 0.1) out += ch;
    else if (p > th) out += GL[Math.floor(rnd(i * 7 + fr, seed + 3) * GL.length)];
    else out += ' ';
  }
  return out;
}
// decoded text anchored so it doesn't jitter
function dtxt(c, s, x, y, p, o = {}, seed = 0, t = 0) {
  if (p <= 0) return;
  const m = measure(c, s, o);
  const x0 = (o.align || 'center') === 'center' ? x - m / 2 : (o.align === 'right' ? x - m : x);
  txt(c, decode(s, p, seed, t), x0, y, Object.assign({}, o, { align: 'left', gw: m }));
}
// word-by-word reveal; hl = set of words to colour
function words(c, s, x, y, p, o = {}, hl = {}) {
  if (p <= 0) return;
  const ws = s.split(' ');
  const sp = measure(c, ' ', o);
  const widths = ws.map(w => measure(c, w, o));
  const total = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = (o.align === 'left') ? x : x - total / 2;
  ws.forEach((w, i) => {
    const q = E.outCubic(clamp((p - i / ws.length * 0.6) / 0.4));
    if (q > 0) txt(c, w, cx, y + (1 - q) * 24, Object.assign({}, o, { align: 'left', a: (o.a ?? 1) * q, color: hl[w] || o.color }));
    cx += widths[i] + sp;
  });
}
function slam(c, s, x, y, p, o = {}, from = 1.8) {
  if (p <= 0) return;
  const q = E.outExpo(p);
  c.save(); c.translate(x, y); c.scale(lerp(from, 1, q), lerp(from, 1, q));
  txt(c, s, 0, 0, Object.assign({}, o, { a: (o.a ?? 1) * clamp(p * 4) }));
  c.restore();
}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function pill(c, s, x, y, o = {}) {
  const m = measure(c, s, o), pad = o.pad || 22, h = o.h || (o.size || 20) * 2;
  rrect(c, x - m / 2 - pad, y - h / 2, m + pad * 2, h, h / 2);
  c.save(); c.globalAlpha *= (o.a ?? 1);
  c.fillStyle = o.bg || 'rgba(220,0,255,.14)'; c.fill();
  c.lineWidth = o.lw || 2; c.strokeStyle = o.border || C.pink; c.stroke();
  c.restore();
  txt(c, s, x + (o.ls || 0) / 2, y + 1, o);
  return m + pad * 2;
}

// ---------------------------------------------------------------- fx helpers
function rings(c, x, y, dt, o = {}) {
  if (dt < 0 || dt > 1.8) return;
  const n = o.n || 3, R = o.r || 700, col = o.color || '255,135,255';
  for (let k = 0; k < n; k++) {
    const q = (dt - k * 0.12) / (o.dur || 1.2);
    if (q <= 0 || q >= 1) continue;
    c.save(); c.beginPath(); c.arc(x, y, E.outCubic(q) * R, 0, TAU);
    c.lineWidth = (1 - q) * (o.lw || 14); c.strokeStyle = `rgba(${col},${(1 - q) * (o.a || 1)})`; c.stroke(); c.restore();
  }
}
function burst(c, x, y, dt, n, seed, spd = 900, o = {}) {
  if (dt < 0 || dt > 2.2) return;
  const life = o.life || 2.0;
  for (let i = 0; i < n; i++) {
    const ang = rnd(i, seed) * TAU, v = spd * (0.25 + rnd(i, seed + 1) * 0.75);
    const d = v * (1 - Math.exp(-dt * 3)) / 3;
    const px = x + Math.cos(ang) * d, py = y + Math.sin(ang) * d + 60 * dt * dt;
    const a = clamp(1 - dt / (life * (0.5 + rnd(i, seed + 2) * 0.5)));
    if (a <= 0) continue;
    const sz = 2 + rnd(i, seed + 3) * 6;
    c.save(); c.translate(px, py); c.rotate(dt * 6 * (rnd(i, seed + 4) - .5) + ang);
    c.globalAlpha = a; c.fillStyle = [C.pink, C.mag, C.white, C.violet][i % 4];
    c.beginPath(); c.moveTo(0, -sz * 1.6); c.lineTo(sz, 0); c.lineTo(0, sz * 1.6); c.lineTo(-sz, 0); c.closePath(); c.fill();
    c.restore();
  }
}
function check(c, x, y, s, p, col, lw = 6) {
  if (p <= 0) return;
  const pts = [[-0.55, 0.02], [-0.15, 0.42], [0.6, -0.48]];
  const l1 = Math.hypot(.4, .4), l2 = Math.hypot(.75, .9), L = l1 + l2;
  c.save(); c.translate(x, y); c.beginPath(); c.moveTo(pts[0][0] * s, pts[0][1] * s);
  const d = p * L;
  if (d <= l1) { const q = d / l1; c.lineTo(lerp(pts[0][0], pts[1][0], q) * s, lerp(pts[0][1], pts[1][1], q) * s); }
  else { c.lineTo(pts[1][0] * s, pts[1][1] * s); const q = (d - l1) / l2; c.lineTo(lerp(pts[1][0], pts[2][0], q) * s, lerp(pts[1][1], pts[2][1], q) * s); }
  c.lineWidth = lw; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col; c.stroke(); c.restore();
}
function cross(c, x, y, s, p, col, lw = 6) {
  if (p <= 0) return;
  c.save(); c.translate(x, y); c.lineWidth = lw; c.lineCap = 'round'; c.strokeStyle = col;
  const q1 = clamp(p * 2), q2 = clamp(p * 2 - 1);
  c.beginPath(); c.moveTo(-s * .45, -s * .45); c.lineTo(lerp(-s * .45, s * .45, q1), lerp(-s * .45, s * .45, q1)); c.stroke();
  if (q2 > 0) { c.beginPath(); c.moveTo(s * .45, -s * .45); c.lineTo(lerp(s * .45, -s * .45, q2), lerp(-s * .45, s * .45, q2)); c.stroke(); }
  c.restore();
}
function spinner(c, x, y, r, t, col) {
  c.save(); c.translate(x, y); c.rotate(t * 7); c.lineWidth = 4; c.lineCap = 'round'; c.strokeStyle = col;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 1.2); c.stroke(); c.restore();
}

// ---------------------------------------------------------------- icons
function iconGlobe(c, x, y, r, t, col = C.pink) {
  c.save(); c.translate(x, y); c.strokeStyle = col; c.lineWidth = 2.5;
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke();
  for (let k = 0; k < 3; k++) {
    const ph = ((t * 0.35 + k / 3) % 1) * Math.PI;
    const rx = Math.abs(Math.cos(ph)) * r;
    c.globalAlpha = 0.4 + 0.6 * Math.sin(ph);
    c.beginPath(); c.ellipse(0, 0, Math.max(rx, .5), r, 0, 0, TAU); c.stroke();
  }
  c.globalAlpha = 1;
  [-0.5, 0, 0.5].forEach(f => { const yy = f * r, hw = Math.sqrt(r * r - yy * yy); c.beginPath(); c.moveTo(-hw, yy); c.lineTo(hw, yy); c.stroke(); });
  c.restore();
}
function iconBrain(c, x, y, r, t, col = C.pink) {
  const L = [[-0.75, [-0.5, 0.5]], [0, [-0.7, 0, 0.7]], [0.75, [-0.35, 0.35]]];
  const nodes = []; L.forEach(([lx, ys], li) => ys.forEach(yy => nodes.push([lx * r, yy * r, li])));
  c.save(); c.translate(x, y); c.lineWidth = 1.5;
  for (const a of nodes) for (const b of nodes) if (b[2] === a[2] + 1) {
    c.strokeStyle = col; c.globalAlpha = .35 + .35 * Math.sin(t * 5 + a[1] + b[1]);
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  }
  c.globalAlpha = 1;
  nodes.forEach((n, i) => { c.beginPath(); c.arc(n[0], n[1], r * 0.14 * (1 + .25 * Math.sin(t * 6 + i)), 0, TAU); c.fillStyle = i % 2 ? col : C.white; c.fill(); });
  c.restore();
}
function iconDoc(c, x, y, r, t, col = C.pink, ok = 0) {
  c.save(); c.translate(x, y); c.strokeStyle = col; c.lineWidth = 2.5; c.lineJoin = 'round';
  const w = r * 1.3, h = r * 1.65;
  c.beginPath(); c.moveTo(-w / 2, -h / 2); c.lineTo(w / 2 - r * .35, -h / 2); c.lineTo(w / 2, -h / 2 + r * .35); c.lineTo(w / 2, h / 2); c.lineTo(-w / 2, h / 2); c.closePath(); c.stroke();
  for (let i = 0; i < 3; i++) { c.globalAlpha = .7; c.beginPath(); c.moveTo(-w / 2 + r * .25, -h / 2 + r * (.45 + i * .32)); c.lineTo(w / 2 - r * .3 - (i === 2 ? r * .3 : 0), -h / 2 + r * (.45 + i * .32)); c.stroke(); }
  c.globalAlpha = 1; c.restore();
  check(c, x + r * .15, y + r * .45, r * .55, ok, C.white, 4);
}
function iconCoin(c, x, y, r, t, col = C.pink) {
  c.save(); c.translate(x, y); c.lineWidth = 2.5; c.strokeStyle = col;
  for (let i = 2; i >= 0; i--) {
    const yy = r * .45 - i * r * .3 + Math.sin(t * 3 + i) * 2;
    c.beginPath(); c.ellipse(0, yy, r * .7, r * .25, 0, 0, TAU); c.fillStyle = i === 0 ? 'rgba(255,135,255,.35)' : 'rgba(30,0,50,.95)'; c.fill(); c.stroke();
  }
  // up arrow
  c.beginPath(); c.moveTo(0, -r * .35); c.lineTo(0, -r * 1.0); c.moveTo(-r * .25, -r * .75); c.lineTo(0, -r * 1.0); c.lineTo(r * .25, -r * .75);
  c.strokeStyle = C.white; c.lineCap = 'round'; c.stroke();
  c.restore();
}
function iconPlane(c, s) { // pointing +x, centered
  c.beginPath();
  c.moveTo(1.0 * s, 0);
  c.lineTo(0.7 * s, 0.12 * s); c.lineTo(0.15 * s, 0.13 * s); c.lineTo(-0.25 * s, 0.75 * s); c.lineTo(-0.42 * s, 0.75 * s);
  c.lineTo(-0.2 * s, 0.13 * s); c.lineTo(-0.65 * s, 0.13 * s); c.lineTo(-0.8 * s, 0.35 * s); c.lineTo(-0.92 * s, 0.35 * s);
  c.lineTo(-0.85 * s, 0); c.lineTo(-0.92 * s, -0.35 * s); c.lineTo(-0.8 * s, -0.35 * s); c.lineTo(-0.65 * s, -0.13 * s);
  c.lineTo(-0.2 * s, -0.13 * s); c.lineTo(-0.42 * s, -0.75 * s); c.lineTo(-0.25 * s, -0.75 * s); c.lineTo(0.15 * s, -0.13 * s);
  c.lineTo(0.7 * s, -0.12 * s); c.closePath();
}
function iconCloud(c, x, y, r, t) {
  c.save(); c.translate(x, y);
  // rain
  c.strokeStyle = C.cyan; c.lineWidth = 2.5; c.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const rx = (-0.75 + i * 0.19) * r, ph = (t * 1.6 + rnd(i, 51)) % 1;
    const ry = r * 0.35 + ph * r * 0.9;
    c.globalAlpha = 1 - ph; c.beginPath(); c.moveTo(rx - 4, ry); c.lineTo(rx - 9, ry + 14); c.stroke();
  }
  c.globalAlpha = 1;
  // lightning
  const fl = (t % 1.3) < 0.12 ? 1 : 0;
  if (fl) { c.fillStyle = C.white; c.beginPath(); c.moveTo(r * .1, r * .2); c.lineTo(-r * .2, r * .75); c.lineTo(r * .02, r * .7); c.lineTo(-r * .08, r * 1.15); c.lineTo(r * .3, r * .55); c.lineTo(r * .08, r * .58); c.closePath(); c.fill(); }
  // cloud
  c.beginPath();
  c.arc(-r * .45, r * .05, r * .38, Math.PI * .5, Math.PI * 1.5);
  c.arc(-r * .1, -r * .3, r * .45, Math.PI * 1.05, Math.PI * 1.9);
  c.arc(r * .4, -r * .05, r * .4, Math.PI * 1.35, Math.PI * .5);
  c.closePath();
  c.fillStyle = 'rgba(40,0,70,.95)'; c.fill();
  c.strokeStyle = C.pink; c.lineWidth = 3; c.stroke();
  c.restore();
}
function iconShip(c, x, y, r, t) {
  c.save(); c.translate(x, y + Math.sin(t * 2.2) * 4); c.rotate(Math.sin(t * 1.7) * 0.04);
  const cols = [C.pink, C.mag, C.violet, C.hot];
  for (let i = 0; i < 6; i++) {
    const col = i % 3, row = Math.floor(i / 3);
    c.fillStyle = cols[(i + row) % 4]; c.fillRect(-r * .55 + col * r * .38, -r * .25 - row * r * .26, r * .34, r * .22);
  }
  c.beginPath(); c.moveTo(-r * .95, r * .02); c.lineTo(r * 1.0, r * .02); c.lineTo(r * .75, r * .42); c.lineTo(-r * .75, r * .42); c.closePath();
  c.fillStyle = 'rgba(40,0,70,.95)'; c.fill(); c.strokeStyle = C.white; c.lineWidth = 3; c.stroke();
  c.restore();
  c.save(); c.translate(x, y); c.strokeStyle = C.cyan; c.lineWidth = 2.5;
  for (let k = 0; k < 2; k++) {
    c.globalAlpha = k ? .5 : 1; c.beginPath();
    for (let i = 0; i <= 40; i++) { const xx = -r * 1.2 + i * r * 2.4 / 40; const yy = r * (.5 + k * .18) + Math.sin(xx * .08 + t * 4 + k) * 4; i ? c.lineTo(xx, yy) : c.moveTo(xx, yy); }
    c.stroke();
  }
  c.restore();
}
function iconPin(c, x, y, r, t) {
  iconGlobe(c, x, y + r * .2, r * .8, t, 'rgba(255,135,255,.6)');
  const b = Math.abs(Math.sin(t * 3)) * r * .25;
  rings(c, x, y - r * .15, (t % 1.2), { n: 1, r: r * .9, lw: 4, dur: 1.1, color: '92,242,255' });
  c.save(); c.translate(x, y - r * .55 - b);
  c.beginPath(); c.arc(0, 0, r * .32, Math.PI, 0); c.lineTo(0, r * .6); c.closePath();

  const CARDS = [['WEATHER', 'rainfall · storms · drought', iconCloud], ['SHIPPING', 'delays · disruptions', iconShip], ['REAL-WORLD', 'events you can verify', iconPin]];
  CARDS.forEach(([title, sub, icon], i) => {
    const p = P(lt, .5 + i * .25, .7);
    if (p <= 0) return;
    const cx = 215 + i * 325, cy = 575 + Math.sin(t * 1.6 + i * 1.3) * 7;
    const q = E.outBack(p);
    ctx.save(); ctx.translate(cx, cy + (1 - E.outCubic(p)) * 120); ctx.scale(Math.max(.01, q), 1); ctx.globalAlpha = clamp(p * 2);
    const w = 290, h = 390;
    rrect(ctx, -w / 2, -h / 2, w, h, 22); ctx.fillStyle = 'rgba(26,0,46,.82)'; ctx.fill();
    const bg = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); bg.addColorStop(0, C.pink); bg.addColorStop(1, 'rgba(123,44,255,.4)');
    ctx.strokeStyle = bg; ctx.lineWidth = 2; ctx.stroke();
    const tg = ctx.createRadialGradient(0, -h / 2 + 110, 0, 0, -h / 2 + 110, 150); tg.addColorStop(0, 'rgba(220,0,255,.35)'); tg.addColorStop(1, 'rgba(220,0,255,0)');
    ctx.fillStyle = tg; ctx.fillRect(-w / 2, -h / 2, w, 260);
    txt(ctx, '0' + (i + 1), -w / 2 + 22, -h / 2 + 26, { size: 13, font: MONO, w: 700, color: C.pink, align: 'left', ls: 2 });
    icon(ctx, 0, -h / 2 + 125, 62, t);
    txt(ctx, title, 0, h / 2 - 110, { size: 32, w: 900, ls: 1 });
    ctx.fillStyle = C.pink; ctx.fillRect(-24, h / 2 - 80, 48, 3);
    txt(ctx, sub, 0, h / 2 - 52, { size: 14, font: MONO, w: 400, color: C.lav });
    ctx.restore();
  });
  words(ctx, 'Weather · shipping · and much more.', 540, 905, P(lt, 1.9, 1.0), { size: 30, w: 700 }, { 'more.': C.pink });
}

// ---- S8: reality check ------------------------------------------------------
function s8(t) {
  const lt = t - 50;
  dtxt(ctx, 'OF COURSE, THESE REMAIN ESSENTIAL', 540, 240, P(lt, .1, .8), { size: 20, w: 700, font: MONO, ls: 3, color: C.pink }, 91, t);
  const ITEMS = ['RELIABLE DATA', 'WELL-DEFINED POLICIES', 'SECURITY', 'REGULATORY COMPLIANCE'];
  ITEMS.forEach((s, i) => {
    const p = E.outExpo(P(lt, .35 + i * .22, .6));
    if (p <= 0) return;
    const y = 345 + i * 92, dir = i % 2 ? 1 : -1;
    ctx.save(); ctx.translate(dir * (1 - p) * 300, 0); ctx.globalAlpha = p;
    const o = { size: 36, w: 900, ls: 1 };
    const m = measure(ctx, s, o);
    rrect(ctx, 540 - m / 2 - 70, y - 34, m + 110, 68, 34); ctx.fillStyle = 'rgba(26,0,46,.85)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,135,255,.55)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(540 - m / 2 - 32, y + 2); ctx.scale(.42, .42); polyPath(ctx, LOGO.C, 1); ctx.restore();
    ctx.save(); ctx.translate(540 - m / 2 - 32, y - 10); ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-11, 10); ctx.lineTo(0, 16); ctx.lineTo(11, 10); ctx.closePath(); ctx.fillStyle = C.pink; ctx.fill(); ctx.restore();
    txt(ctx, s, 540 + 20, y + 1, o);
    ctx.restore();
  });
  words(ctx, 'AI-based evaluation alone cannot guarantee', 540, 760, P(lt, 1.6, .9), { size: 32, w: 700, a: .92 });
  words(ctx, 'that every insurance decision is correct.', 540, 806, P(lt, 1.9, .9), { size: 32, w: 700, a: .92 }, { 'correct.': C.pink });
}

// ---- S9: the bigger question ------------------------------------------------
function s9(t) {
  const lt = t - 54;
  dtxt(ctx, 'THE BIGGER QUESTION', 540, 220, P(lt, .1, .8), { size: 22, w: 700, font: MONO, ls: 6, color: C.pink }, 101, t);
  words(ctx, 'What other industries could benefit', 540, 305, P(lt, .4, 1.0), { size: 46, w: 800 });
  words(ctx, 'from contracts that…', 540, 362, P(lt, .9, .8), { size: 46, w: 800 });
  // EXECUTE
  const ep = P(lt, 1.8, .4);
  if (ep > 0) {
    const mv = E.outExpo(P(lt, 3.0, .6));
    const o = { size: 160, w: 900, ls: 2 };
    o.size = fit(ctx, 'EXECUTE', o, 900);
    const sc = lerp(1, .5, mv), y = lerp(570, 492, mv);
    ctx.save(); ctx.translate(540, y); ctx.scale(sc, sc);
    slam(ctx, 'EXECUTE', 0, 0, ep, Object.assign({}, o, { a: lerp(1, .38, mv) }), 1.9);
    const m = measure(ctx, 'EXECUTE', o);
    const sp = E.inOutCubic(P(lt, 2.75, .25));
    if (sp > 0) { ctx.fillStyle = C.hot; ctx.fillRect(-m / 2 - 20, -8, (m + 40) * sp, 16); }
    ctx.restore();
    if (mv > 0) txt(ctx, 'NOT JUST', 540, y - 70 * sc - 26 + 30 * (1 - mv), { size: 18, w: 700, font: MONO, ls: 6, color: C.lav, a: mv * .8 });
  }
  const vp = P(lt, 3.2, .45);
  if (vp > 0) {
    const o = { size: 170, w: 900, ls: 2 };
    o.size = fit(ctx, 'EVALUATE?', o, 960);
    const pulse = 1 + .015 * Math.sin(t * 6) * P(lt, 3.8, .5);
    ctx.save(); ctx.translate(540, 670); ctx.scale(pulse, pulse);
    slam(ctx, 'EVALUATE?', 0, 0, vp, Object.assign(o, { grad: [C.white, C.pink, C.mag, C.violet] }), 2.4);
    ctx.restore();
    rings(ctx, 540, 670, lt - 3.2, { r: 800, lw: 16 });
    burst(ctx, 540, 670, lt - 3.2, 70, 103, 1200);
  }
  dtxt(ctx, 'INSTEAD OF SIMPLY EXECUTING PREDEFINED INSTRUCTIONS', 540, 800, P(lt, 3.9, .9), { size: 17, w: 700, font: MONO, ls: 2, color: C.lav }, 104, t);
  const cq = P(lt, 4.6, .6);
  if (cq > 0) { ctx.save(); ctx.translate(540, 880); const q = E.outBack(cq); ctx.scale(q, q); pill(ctx, 'TELL US BELOW ↓', 0, 0, { size: 16, font: MONO, w: 700, ls: 4, color: C.white, h: 42, bg: 'rgba(220,0,255,.3)' }); ctx.restore(); }
}

// ---- S10: outro ------------------------------------------------------------
function s10(t) {
  const lt = t - 60;
  const cx = 540, cy = 440;
  const conv = E.outExpo(P(lt, 0, .7));
  // orbit rings: back halves
  const orbit = (front) => {
    [[.35, 360, 95, 1], [-.35, 330, 80, -1]].forEach(([tilt, rx, ry, dir], k) => {
      const a0 = P(lt, .3 + k * .15, .6);
      if (a0 <= 0) return;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt);
      ctx.strokeStyle = `rgba(255,135,255,${.45 * a0})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, rx * E.outCubic(a0), ry * E.outCubic(a0), 0, front ? 0 : Math.PI, front ? Math.PI : TAU); ctx.stroke();
      for (let d = 0; d < 3; d++) {
        const a = (t * .9 * dir + d * TAU / 3) % TAU, sa = Math.sin(a);
        if ((sa > 0) !== front) continue;
        ctx.beginPath(); ctx.arc(Math.cos(a) * rx * E.outCubic(a0), sa * ry * E.outCubic(a0), 6, 0, TAU); ctx.fillStyle = d === 0 ? C.white : C.pink; ctx.globalAlpha = a0; ctx.fill(); ctx.globalAlpha = 1;
      }
      ctx.restore();
    });
  };
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 420);
  g.addColorStop(0, `rgba(220,0,255,${.3 * conv})`); g.addColorStop(1, 'rgba(220,0,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  orbit(false);
  const off = { L: [-600 * (1 - conv), -200 * (1 - conv), -1 * (1 - conv)], R: [600 * (1 - conv), -200 * (1 - conv), 1 * (1 - conv)], C: [0, 500 * (1 - conv), 3 * (1 - conv)] };
  drawLogo(ctx, cx, cy + Math.sin(t * 2) * 5, .95, { off, shine: lerp(-.5, 1.6, P(lt, 1.0, .9)) });
  orbit(true);
  rings(ctx, cx, cy, lt - .55, { r: 800, lw: 14 });
  burst(ctx, cx, cy, lt - .55, 80, 111, 1300);
  // wordmark with per-letter rise
  const word = 'GenLayer', o = { size: 112, w: 900, ls: 1 };
  const m = measure(ctx, word, o);
  let x = 540 - m / 2;
  for (let i = 0; i < word.length; i++) {
    const ch = word[i], cw = measure(ctx, ch, o);
    const p = E.outExpo(P(lt, .7 + i * .05, .7));
    if (p > 0) {
      const gx0 = 540 - m / 2;
      ctx.save(); ctx.globalAlpha = p;
      setFont(ctx, o); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const gg = ctx.createLinearGradient(gx0, 0, gx0 + m, 0); gg.addColorStop(0, C.white); gg.addColorStop(.5, C.pink); gg.addColorStop(1, C.mag);
      ctx.fillStyle = gg; ctx.fillText(ch, x, 760 + (1 - p) * 60);
      ctx.restore();
    }
    x += cw;
  }
  dtxt(ctx, 'INTELLIGENT CONTRACTS  ·  AI × BLOCKCHAIN × REAL WORLD', 540, 840, P(lt, 1.4, .9), { size: 17, w: 700, font: MONO, ls: 3, color: C.pink }, 112, t);
  const hp = P(lt, 2.0, .6);
  if (hp > 0) txt(ctx, '@GenLayer', 540, 900, { size: 22, w: 700, font: MONO, color: C.white, a: hp * .8, ls: 2 });
}

// ---------------------------------------------------------------- transitions / post
function drawTransition(t) {
  for (const tt of TRANSITIONS) {
    const p = (t - (tt - .42)) / .84;
    if (p <= 0 || p >= 1.2) continue;
    const N = 7, hh = H / N;
    const cols = [C.mag, C.pink, C.violet, C.deep, C.mag, C.pink, C.violet];
    for (let i = 0; i < N; i++) {
      const d = rnd(i, tt) * .1;
      const lead = E.outCubic(clamp((p - d) / .5));
      const trail = E.inOutCubic(clamp((p - .5 - d) / .5));
      const x1 = lerp(-200, W + 260, lead), x0 = lerp(-260, W + 260, trail);
      if (x1 <= x0) continue;
      const sk = 120;
      ctx.beginPath(); ctx.moveTo(x0, i * hh - 1); ctx.lineTo(x1, i * hh - 1); ctx.lineTo(x1 - sk, (i + 1) * hh + 1); ctx.lineTo(x0 - sk, (i + 1) * hh + 1); ctx.closePath();
      ctx.fillStyle = cols[(i + Math.round(tt)) % cols.length]; ctx.fill();
    }
  }
}
function camera(t) {
  let sx = 0, sy = 0, rot = 0;
  for (const [ti, amp] of IMPACTS) {
    const dt = t - ti; if (dt < 0 || dt > 1) continue;
    const k = amp * Math.exp(-dt * 7);
    sx += Math.sin(dt * 90 + ti) * k; sy += Math.cos(dt * 77 + ti * 2) * k; rot += Math.sin(dt * 60) * k * .0008;
  }
  return { sx, sy, rot };
}
function flashAmt(t) { let f = 0; for (const [ti, , a] of IMPACTS) { const dt = t - ti; if (dt >= 0 && dt < 1) f += a * Math.exp(-dt * 9); } return clamp(f); }
function glitchAmt(t) { let g = 0; for (const [ti, d] of GLITCHES) { const dt = t - ti; if (dt >= -.02 && dt < d) g = Math.max(g, 1 - dt / d); } return g; }

const VIG = (() => { const c = mk(W, H), x = c.getContext('2d'); const g = x.createRadialGradient(540, 540, 300, 540, 540, 800); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.72)'); x.fillStyle = g; x.fillRect(0, 0, W, H); return c; })();
const GRAIN = Array.from({ length: 4 }, (_, k) => { const c = mk(W / 2, H / 2), x = c.getContext('2d'); const id = x.createImageData(W / 2, H / 2); for (let i = 0; i < id.data.length; i += 4) { const v = rnd(i, k + 900) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); return c; });

function post(t) {
  const g = glitchAmt(t);
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.globalCompositeOperation = 'source-over'; mctx.globalAlpha = 1; mctx.filter = 'none';
  if (g > 0) {
    mctx.fillStyle = '#000'; mctx.fillRect(0, 0, W, H);
    const off = 6 + 26 * g;
    [['#ff0000', -off], ['#00ff00', 0], ['#0000ff', off]].forEach(([col, dx]) => {
      tctx.globalCompositeOperation = 'source-over'; tctx.drawImage(base, 0, 0);
      tctx.globalCompositeOperation = 'multiply'; tctx.fillStyle = col; tctx.fillRect(0, 0, W, H);
      mctx.globalCompositeOperation = 'lighter'; mctx.drawImage(tmp, dx, 0);
    });
    mctx.globalCompositeOperation = 'source-over';
    const fr = Math.floor(t * 30);
    for (let k = 0; k < 9; k++) {
      if (rnd(k, fr) > .3 + .6 * g) continue;
      const y = rnd(k * 3 + 1, fr) * H, h = 8 + rnd(k * 3 + 2, fr) * 70 * g, dx = (rnd(k * 3 + 3, fr) - .5) * 160 * g;
      mctx.drawImage(main, 0, y, W, h, dx, y, W, h);
    }
  } else {
    mctx.drawImage(base, 0, 0);
  }
  // bloom
  bA.filter = 'blur(5px)'; bA.clearRect(0, 0, W / 4, H / 4); bA.drawImage(base, 0, 0, W / 4, H / 4);
  bB.filter = 'blur(3px)'; bB.clearRect(0, 0, W / 12, H / 12); bB.drawImage(base, 0, 0, W / 12, H / 12);
  mctx.globalCompositeOperation = 'lighter';
  mctx.globalAlpha = .36; mctx.drawImage(bloomA, 0, 0, W, H);
  mctx.globalAlpha = .42; mctx.drawImage(bloomB, 0, 0, W, H);
  // flash
  const f = flashAmt(t);
  if (f > 0) { mctx.globalAlpha = f; mctx.fillStyle = '#ffd6ff'; mctx.fillRect(0, 0, W, H); }
  mctx.globalCompositeOperation = 'source-over'; mctx.globalAlpha = 1;
  mctx.drawImage(VIG, 0, 0);
  // grain
  mctx.globalCompositeOperation = 'overlay'; mctx.globalAlpha = .07;
  mctx.drawImage(GRAIN[Math.floor(t * 30) % 4], 0, 0, W, H);
  mctx.globalCompositeOperation = 'source-over';
  // scanline sweep
  const sy = ((t * 260) % (H + 200)) - 100;
  const sg = mctx.createLinearGradient(0, sy - 60, 0, sy + 60); sg.addColorStop(0, 'rgba(255,135,255,0)'); sg.addColorStop(.5, 'rgba(255,135,255,.035)'); sg.addColorStop(1, 'rgba(255,135,255,0)');
  mctx.fillStyle = sg; mctx.fillRect(0, sy - 60, W, 120);
  // fades
  const fade = Math.max(1 - P(t, 0, .5), P(t, 65.2, .8));
  if (fade > 0) { mctx.globalAlpha = fade; mctx.fillStyle = '#000'; mctx.fillRect(0, 0, W, H); mctx.globalAlpha = 1; }
}

const FN = { s1, s2, s3, s4, s5, s6, s7, s8, s9, s10 };
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  drawBG(t);
  const sc = SCENES.find(s => t >= s[0] && t < s[1]) || SCENES[SCENES.length - 1];
  const cam = camera(t);
  const lp = (t - sc[0]) / (sc[1] - sc[0]);
  const z = 1 + .03 * lp;
  ctx.save();
  ctx.translate(540 + cam.sx, 540 + cam.sy); ctx.rotate(cam.rot); ctx.scale(z, z); ctx.translate(-540, -540);
  FN[sc[2]](t);
  ctx.restore();
  drawHUD(t, sc[3]);
  drawTransition(t);
  post(t);
}
window.renderFrame = renderFrame;
window.DUR = DUR;

// live preview unless ?render
if (!/render/.test(location.search)) {
  const m = location.search.match(/t=([\d.]+)/);
  let t0 = performance.now() - (m ? +m[1] * 1000 : 0);
  document.fonts.ready.then(() => {
    const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; renderFrame(t); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
